name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so we can tell which copy was uploaded last

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Forge 1.20.1 MDK
        run: |
          curl -L -o /tmp/mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir -p /tmp/mdk
          unzip -q /tmp/mdk.zip -d /tmp/mdk
          DIR=$(dirname "$(find /tmp/mdk -maxdepth 2 -name gradlew | head -n1)")
          echo "MDK_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Pick the newest copy of the mod and put it into the MDK
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # ---- code: every folder that holds GeistMod.java is a candidate; newest upload wins
          BEST=""; BEST_T=-1
          for f in $(find . -path ./.git -prune -o -name GeistMod.java -print); do
            d=$(dirname "$f"); d=${d#./}
            t=$(git log -1 --format=%ct -- "$d" ":(exclude)$d/java" ":(exclude)$d/resources" 2>/dev/null)
            t=${t:-0}
            echo "code copy: $d  (last uploaded: $(date -d @$t 2>/dev/null))"
            if [ "$t" -gt "$BEST_T" ]; then BEST_T=$t; BEST=$d; fi
          done
          if [ -z "$BEST" ]; then echo "::error::Could not find the mod code (GeistMod.java). Upload the java folder."; exit 1; fi
          echo "::notice::Building code from: $BEST"

          # ---- resources: every folder holding META-INF/mods.toml is a candidate; newest upload wins
          RBEST=""; RBEST_T=-1
          for f in $(find . -path ./.git -prune -o -path '*/META-INF/mods.toml' -print); do
            r=$(dirname "$(dirname "$f")"); r=${r#./}
            t=$(git log -1 --format=%ct -- "$r" 2>/dev/null); t=${t:-0}
            echo "resources copy: $r  (last uploaded: $(date -d @$t 2>/dev/null))"
            if [ "$t" -gt "$RBEST_T" ]; then RBEST_T=$t; RBEST=$r; fi
          done
          if [ -z "$RBEST" ]; then echo "::error::Could not find the mod resources (META-INF/mods.toml). Upload the resources folder."; exit 1; fi
          echo "::notice::Building resources from: $RBEST"

          rm -rf "$MDK_DIR/src"
          mkdir -p "$MDK_DIR/src/main/java/com/geist" "$MDK_DIR/src/main/resources"
          # copy the chosen code, leaving out any accidental nested copies inside it
          rsync -a --exclude '/java/' --exclude '/resources/' "$BEST/" "$MDK_DIR/src/main/java/com/geist/"
          for item in META-INF assets data pack.mcmeta; do
            if [ -e "$RBEST/$item" ]; then cp -r "$RBEST/$item" "$MDK_DIR/src/main/resources/"; fi
          done

          cd "$MDK_DIR"
          sed -i 's/^mod_id=.*/mod_id=geist/' gradle.properties
          sed -i 's/^mod_name=.*/mod_name=G.E.I.S.T. Visor/' gradle.properties
          sed -i 's/^mod_version=.*/mod_version=1.0.0/' gradle.properties
          sed -i 's/^mod_group_id=.*/mod_group_id=com.geist/' gradle.properties
          chmod +x gradlew

      - name: Build the jar
        run: |
          cd "$MDK_DIR"
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee /tmp/build.log

      - name: Show compile errors
        if: failure()
        run: |
          echo "## Compile errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 3 "error:" /tmp/build.log | sed 's#.*/src/main/java/##' | head -n 120 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep "error:" /tmp/build.log | sed 's#.*/src/main/java/##' | head -n 20 | while read -r line; do echo "::error::$line"; done

      - name: Copy the jar out
        run: |
          mkdir -p output
          cp "$MDK_DIR"/build/libs/*.jar output/

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: GEIST-jar
          path: output/*.jar
